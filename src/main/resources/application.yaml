spring:
  application:
    name: pos

  output:
    ansi:
      enabled: always

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/dacca_pos?createDatabaseIfNotExist=true&connectionTimeZone=UTC
    username: root
    password: admin

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 4MB

app:
  product-image-directory: uploads/product-images
  purchase:
    default-tax-percent: 5.00
  sale:
    default-vat-percent: 5.00

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.hibernate: ERROR
    org.springframework.boot.web.servlet.support.ErrorPageFilter: DEBUG
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: TRACE

management:
  endpoints:
    web:
      exposure:
        include: "*"

#spring.datasource.hikari.maximum-pool-size: 20
#spring.datasource.hikari.minimum-idle: 5
#spring.datasource.hikari.idle-timeout: 30000
#spring.datasource.hikari.max-lifetime: 1800000

server:
  port: 8081
