<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<!-- Head (all meta link scripts go here ) START -->
<div th:replace="fragments/head :: head"></div>
<head/>
<!--end::Head-->
<!--begin::Body-->
<body class="layout-fixed sidebar-expand-lg sidebar-mini bg-body-tertiary">
<!--begin::App Wrapper-->
<div class="app-wrapper">
    <!-- TOP Menu (all meta link scripts go here ) START -->
    <div th:replace="fragments/topmenu :: topmenu"></div>
    <!-- TOP Menu (all meta link scripts go here ) END -->

    <!-- Left side column. contains the sidebar START -->
    <div th:replace="fragments/menusidebar :: menusidebar"></div>
    <!-- Left side column. contains the sidebar END -->

    <main class="app-main">
        <div class="app-content-top-area">
            <div class="container-fluid">
                <div class="d-flex justify-content-between align-items-center">
                    <div class="fw-semibold">Vehicle Model Management</div>
                    <button type="button"
                            class="btn btn-primary"
                            id="btnCreateVehicleModel"
                            data-bs-toggle="modal"
                            data-bs-target="#vehicleModelModal">
                        <i class="bi bi-plus-circle me-1"></i> Create Vehicle Model
                    </button>
                </div>
            </div>
        </div>

        <div class="app-content-header">
            <div class="container-fluid">
                <h3 class="mb-0">Vehicle Models</h3>
            </div>
        </div>

        <div class="app-content">
            <div class="container-fluid">

                <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
                    <span th:text="${successMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show">
                    <span th:text="${errorMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div class="card mb-3">
                    <div class="card-header">
                        <h3 class="card-title">Filter</h3>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/vehicle-models}" method="get" class="row g-3 align-items-end">
                            <div class="col-md-4">
                                <label for="makeId" class="form-label">Vehicle Make</label>
                                <select id="makeId" name="makeId" class="form-select">
                                    <option value="">All Makes</option>
                                    <option th:each="make : ${vehicleMakes}"
                                            th:value="${make.id()}"
                                            th:text="${make.name()}"
                                            th:selected="${selectedMakeId != null and selectedMakeId == make.id()}">
                                    </option>
                                </select>
                            </div>
                            <div class="col-md-8">
                                <button type="submit" class="btn btn-primary">Search</button>
                                <a th:href="@{/vehicle-models}" class="btn btn-outline-secondary ms-2">Reset</a>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">Vehicle Model List</h3>
                    </div>
                    <div class="card-body p-0">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Make</th>
                                <th>Name</th>
                                <th>Status</th>
                                <th class="text-end">Actions</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:if="${#lists.isEmpty(vehicleModels)}">
                                <td colspan="5" class="text-center text-muted py-4">No vehicle models found.</td>
                            </tr>
                            <tr th:each="item : ${vehicleModels}">
                                <td th:text="${item.id()}">1</td>
                                <td th:text="${item.makeName()}">Honda</td>
                                <td class="fw-semibold" th:text="${item.name()}">Civic</td>
                                <td>
                                    <span th:if="${item.active()}" class="badge text-bg-success">Active</span>
                                    <span th:unless="${item.active()}" class="badge text-bg-secondary">Inactive</span>
                                </td>
                                <td class="text-end">
                                    <button type="button"
                                            class="btn btn-sm btn-warning btn-edit-vehicle-model"
                                            data-bs-toggle="modal"
                                            data-bs-target="#vehicleModelModal"
                                            th:attr="data-id=${item.id()},
                                                     data-make-id=${item.makeId()},
                                                     data-name=${item.name()},
                                                     data-active=${item.active()}">
                                        <i class="bi bi-pencil-square"></i>
                                    </button>
                                    <form th:action="@{/vehicle-models/{id}/delete(id=${item.id()})}"
                                          method="post"
                                          class="d-inline"
                                          onsubmit="return confirm('Delete this vehicle model?');">
                                        <button type="submit" class="btn btn-sm btn-danger">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="modal fade" id="vehicleModelModal" tabindex="-1">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <form id="vehicleModelForm" method="post" th:object="${form}" th:attr="action=${modalAction}">
                                <div class="modal-header">
                                    <h5 class="modal-title" id="vehicleModelModalLabel" th:text="${modalTitle}">Create Vehicle Model</h5>
                                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                </div>
                                <div class="modal-body">
                                    <div class="mb-3">
                                        <label for="modalMakeId" class="form-label">Make <span class="text-danger">*</span></label>
                                        <select id="modalMakeId" th:field="*{makeId}" class="form-select"
                                                th:classappend="${#fields.hasErrors('makeId')} ? ' is-invalid' : ''">
                                            <option value="">Select make</option>
                                            <option th:each="make : ${vehicleMakes}" th:value="${make.id()}" th:text="${make.name()}"></option>
                                        </select>
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('makeId')}" th:errors="*{makeId}"></div>
                                    </div>

                                    <div class="mb-3">
                                        <label for="name" class="form-label">Model Name <span class="text-danger">*</span></label>
                                        <input type="text" id="name" th:field="*{name}" class="form-control"
                                               th:classappend="${#fields.hasErrors('name')} ? ' is-invalid' : ''">
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                                    </div>

                                    <div class="form-check">
                                        <input type="checkbox" id="active" th:field="*{active}" class="form-check-input">
                                        <label class="form-check-label" for="active">Active</label>
                                    </div>
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                                    <button type="submit" class="btn btn-primary">
                                        <span th:text="${editMode} ? 'Update' : 'Create'">Create</span>
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>
    <!--end::App Main-->
    <!--begin::Footer-->
    <footer class="app-footer">
        <!--begin::To the end-->
        <div class="float-end d-none d-sm-inline">Anything you want</div>
        <!--end::To the end-->
        <!--begin::Copyright-->
        <strong>
            Copyright &copy; 2014-2026&nbsp;
            <a href="https://adminlte.io" class="text-decoration-none">AdminLTE.io</a>.
        </strong>
        All rights reserved.
        <!--end::Copyright-->
    </footer>
    <!--end::Footer-->
</div>
<!--end::App Wrapper-->
<!--begin::Script-->
<!--begin::Third Party Plugin(OverlayScrollbars)-->
<!-- =============================================== -->
<!-- common script START -->
<div th:replace="fragments/commonscripts :: commonscripts"/>
<!-- common script END -->
<script src="/resources/lib/jquery-validation/jquery.validate.min.js"></script>

<script th:inline="javascript">
    $(function () {
        const modal = new bootstrap.Modal(document.getElementById('vehicleModelModal'));
        const $form = $('#vehicleModelForm');
        const $title = $('#vehicleModelModalLabel');

        function resetValidationState() {
            $form.validate().resetForm();
            $form.find('.is-invalid').removeClass('is-invalid');
            $form.find('.is-valid').removeClass('is-valid');
            $form.find('label.error').remove();
        }

        $('#btnCreateVehicleModel').on('click', function () {
            $form.attr('action', '/vehicle-models/create');
            $title.text('Create Vehicle Model');
            $('#modalMakeId').val('');
            $('#name').val('');
            $('#active').prop('checked', true);
            resetValidationState();
        });

        $('.btn-edit-vehicle-model').on('click', function () {
            const $btn = $(this);
            $form.attr('action', '/vehicle-models/' + $btn.data('id') + '/edit');
            $title.text('Edit Vehicle Model');
            $('#modalMakeId').val($btn.data('make-id'));
            $('#name').val($btn.data('name') || '');
            $('#active').prop('checked', $btn.data('active') === true || $btn.data('active') === 'true');
            resetValidationState();
        });

        $form.validate({
            errorElement: 'div',
            errorClass: 'invalid-feedback',
            rules: {
                makeId: { required: true },
                name: { required: true, maxlength: 100 }
            },
            messages: {
                makeId: { required: 'Make is required.' },
                name: {
                    required: 'Model name is required.',
                    maxlength: 'Model name must not exceed 100 characters.'
                }
            },
            errorPlacement: function (error, element) {
                error.addClass('d-block');
                const existing = element.siblings('.invalid-feedback');
                if (existing.length) {
                    existing.first().replaceWith(error);
                } else {
                    error.insertAfter(element);
                }
            },
            highlight: function (element) {
                $(element).addClass('is-invalid').removeClass('is-valid');
            },
            unhighlight: function (element) {
                $(element).removeClass('is-invalid').addClass('is-valid');
            }
        });

        const showModal = /*[[${showVehicleModelModal}]]*/ false;
        if (showModal) {
            modal.show();
        }
    });
</script>
</body>
</html>
