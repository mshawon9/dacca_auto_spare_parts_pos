<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Send Invoice Photo</title>
    <link rel="stylesheet" href="/resources/lib/bootstrap-5.3.8-dist/css/bootstrap.min.css"
          th:href="@{/resources/lib/bootstrap-5.3.8-dist/css/bootstrap.min.css}">
</head>
<body class="bg-body-tertiary">
<main class="container py-4" style="max-width: 560px;">
    <h1 class="h3">Send Invoice Photo</h1>
    <p>Take a clear photo of the whole invoice. Your laptop will review it before extraction or saving.</p>
    <form id="invoicePhoneForm" data-base="/purchase-orders/invoice/phone"
          th:attr="data-base=@{/purchase-orders/invoice/phone}">
        <label for="invoicePhoto" class="form-label">Invoice photo (JPEG or PNG)</label>
        <input id="invoicePhoto" class="form-control mb-3" type="file"
               accept="image/jpeg,image/png" capture="environment">
        <input id="invoiceGallery" type="file" accept="image/jpeg,image/png" hidden>
        <button id="chooseInvoiceGallery" type="button" class="btn btn-outline-secondary w-100 mb-2">Choose Image from Gallery</button>
        <button id="uploadInvoicePhoto" class="btn btn-primary w-100" type="submit">Upload Photo</button>
    </form>
    <p id="invoicePhoneStatus" class="mt-3" role="status" aria-live="polite"></p>
    <p class="small text-body-secondary">The connection expires after 10 minutes and accepts one photo.
        Uploading does not run AI or update stock.</p>
</main>
<script src="/resources/js/purchase-invoice-phone.js" th:src="@{/resources/js/purchase-invoice-phone.js}" defer></script>
</body>
</html>
