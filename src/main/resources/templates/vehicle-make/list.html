<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<!-- Head (all meta link scripts go here ) START -->
<div th:replace="fragments/head :: head"></div>
<head/>
<!--end::Head-->
<!--begin::Body-->
<body class="layout-fixed sidebar-expand-lg sidebar-mini bg-body-tertiary">
<!--begin::App Wrapper-->
<div class="app-wrapper">
    <!-- TOP Menu (all meta link scripts go here ) START -->
    <div th:replace="fragments/topmenu :: topmenu"></div>
    <!-- TOP Menu (all meta link scripts go here ) END -->
    <div id="vehicleMakePageData" class="d-none" th:attr="data-show-modal=${showVehicleMakeModal}"></div>

    <!-- Left side column. contains the sidebar START -->
    <div th:replace="fragments/menusidebar :: menusidebar"></div>
    <!-- Left side column. contains the sidebar END -->
    <main class="app-main">
        <div class="app-content-top-area">
            <div class="container-fluid">
                <div class="d-flex justify-content-between align-items-center">
                    <div class="fw-semibold">Vehicle Make Management</div>
                    <button type="button"
                            class="btn btn-primary"
                            id="btnCreateVehicleMake"
                            data-bs-toggle="modal"
                            data-bs-target="#vehicleMakeModal">
                        <i class="bi bi-plus-circle me-1"></i> Create Vehicle Make
                    </button>
                </div>
            </div>
        </div>

        <div class="app-content-header">
            <div class="container-fluid">
                <h3 class="mb-0">Vehicle Makes</h3>
            </div>
        </div>

        <div class="app-content">
            <div class="container-fluid">
                <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
                    <span th:text="${successMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show">
                    <span th:text="${errorMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">Vehicle Make List</h3>
                    </div>
                    <div class="card-body p-0">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Status</th>
                                <th class="text-end">Actions</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:if="${#lists.isEmpty(vehicleMakes)}">
                                <td colspan="4" class="text-center text-muted py-4">No vehicle makes found.</td>
                            </tr>
                            <tr th:each="item : ${vehicleMakes}">
                                <td th:text="${item.id()}">1</td>
                                <td class="fw-semibold" th:text="${item.name()}">Honda</td>
                                <td>
                                    <span th:if="${item.active()}" class="badge text-bg-success">Active</span>
                                    <span th:unless="${item.active()}" class="badge text-bg-secondary">Inactive</span>
                                </td>
                                <td class="text-end">
                                    <button type="button"
                                            class="btn btn-sm btn-warning btn-edit-vehicle-make"
                                            data-bs-toggle="modal"
                                            data-bs-target="#vehicleMakeModal"
                                            th:attr="data-id=${item.id()},data-name=${item.name()},data-active=${item.active()}">
                                        <i class="bi bi-pencil-square"></i>
                                    </button>
                                    <form th:action="@{/vehicle-makes/{id}/delete(id=${item.id()})}"
                                          method="post"
                                          class="d-inline"
                                          onsubmit="return confirm('Delete this vehicle make?');">
                                        <button type="submit" class="btn btn-sm btn-danger">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="modal fade" id="vehicleMakeModal" tabindex="-1">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <form id="vehicleMakeForm" method="post" th:object="${form}"
                                  th:attr="action=${modalAction}">
                                <div class="modal-header">
                                    <h5 class="modal-title" id="vehicleMakeModalLabel" th:text="${modalTitle}">Create
                                        Vehicle Make</h5>
                                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                </div>
                                <div class="modal-body">
                                    <div class="mb-3">
                                        <label for="name" class="form-label">Name <span
                                                class="text-danger">*</span></label>
                                        <input type="text" id="name" th:field="*{name}" class="form-control"
                                               th:classappend="${#fields.hasErrors('name')} ? ' is-invalid' : ''">
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}"
                                             th:errors="*{name}"></div>
                                    </div>
                                    <div class="form-check">
                                        <input type="checkbox" id="active" th:field="*{active}"
                                               class="form-check-input">
                                        <label class="form-check-label" for="active">Active</label>
                                    </div>
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
                                        Cancel
                                    </button>
                                    <button type="submit" class="btn btn-primary">
                                        <span th:text="${editMode} ? 'Update' : 'Create'">Create</span>
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>
    <!--end::App Main-->
    <!--begin::Footer-->
    <footer class="app-footer">
        <!--begin::To the end-->
        <div class="float-end d-none d-sm-inline">Anything you want</div>
        <!--end::To the end-->
        <!--begin::Copyright-->
        <strong>
            Copyright &copy; 2014-2026&nbsp;
            <a href="https://adminlte.io" class="text-decoration-none">AdminLTE.io</a>.
        </strong>
        All rights reserved.
        <!--end::Copyright-->
    </footer>
    <!--end::Footer-->
</div>
<!--end::App Wrapper-->
<!--begin::Script-->
<!--begin::Third Party Plugin(OverlayScrollbars)-->
<!-- =============================================== -->
<!-- common script START -->
<div th:replace="fragments/commonscripts :: commonscripts"/>
<!-- common script END -->
<script src="/resources/lib/jquery-validation/jquery.validate.min.js"></script>
<script src="/resources/js/vehicle-make-list.js"></script>
</body>
</html>
