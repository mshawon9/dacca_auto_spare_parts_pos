<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<div th:replace="fragments/head :: head"></div>
<head/>
<body class="layout-fixed sidebar-expand-lg sidebar-mini bg-body-tertiary">
<div class="app-wrapper">
    <div th:replace="fragments/topmenu :: topmenu"></div>
    <div th:replace="fragments/menusidebar :: menusidebar"></div>

    <main class="app-main">
        <div class="app-content-top-area">
            <div class="container-fluid">
                <div class="d-flex justify-content-between align-items-center">
                    <div class="fw-semibold">Applications</div>
                    <a th:href="@{/vehicle-applications/create}" class="btn btn-primary">
                        <i class="bi bi-plus-circle me-1"></i> Add Application
                    </a>
                </div>
            </div>
        </div>

        <div class="app-content-header">
            <div class="container-fluid">
                <h3 class="mb-0">Vehicle Applications</h3>
            </div>
        </div>

        <div class="app-content">
            <div class="container-fluid">
                <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
                    <span th:text="${successMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show">
                    <span th:text="${errorMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div class="card mb-3">
                    <div class="card-body">
                        <form th:action="@{/vehicle-applications}" method="get" class="row g-2 align-items-end">
                            <div class="col-md-9">
                                <label for="keyword" class="form-label">Search Application</label>
                                <input type="text" id="keyword" name="keyword" class="form-control"
                                       th:value="${keyword}" placeholder="Search make, model, year, engine">
                            </div>
                            <div class="col-md-3 d-flex gap-2">
                                <button type="submit" class="btn btn-primary flex-fill">Search</button>
                                <a th:href="@{/vehicle-applications}" class="btn btn-outline-secondary">Reset</a>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">Application List</h3>
                    </div>
                    <div class="card-body p-0">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                            <tr>
                                <th>Application</th>
                                <th>Years</th>
                                <th>Status</th>
                                <th class="text-end">Actions</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:if="${#lists.isEmpty(vehicleApplications)}">
                                <td colspan="4" class="text-center text-muted py-4">No applications found.</td>
                            </tr>
                            <tr th:each="item : ${vehicleApplications}">
                                <td>
                                    <div class="fw-semibold" th:text="${item.displayName()}">Toyota Corolla 2006 Up</div>
                                    <div class="small text-muted" th:text="${item.vehicleMakeName() + ' / ' + item.vehicleModelName()}">Toyota / Corolla</div>
                                </td>
                                <td>
                                    <span th:if="${item.yearFrom() == null and item.yearTo() == null}">All years</span>
                                    <span th:if="${item.yearFrom() != null and item.yearTo() == null}" th:text="${item.yearFrom() + ' Up'}">2006 Up</span>
                                    <span th:if="${item.yearFrom() != null and item.yearTo() != null and item.yearFrom().equals(item.yearTo())}" th:text="${item.yearFrom()}">2006</span>
                                    <span th:if="${item.yearFrom() != null and item.yearTo() != null and !item.yearFrom().equals(item.yearTo())}" th:text="${item.yearFrom() + '-' + item.yearTo()}">2006-2012</span>
                                </td>
                                <td>
                                    <span th:if="${item.active()}" class="badge text-bg-success">Active</span>
                                    <span th:unless="${item.active()}" class="badge text-bg-secondary">Inactive</span>
                                </td>
                                <td class="text-end">
                                    <a th:href="@{/vehicle-applications/{id}/edit(id=${item.id()})}" class="btn btn-sm btn-warning">
                                        <i class="bi bi-pencil-square"></i>
                                    </a>
                                    <form th:action="@{/vehicle-applications/{id}/delete(id=${item.id()})}"
                                          method="post"
                                          class="d-inline"
                                          onsubmit="return confirm('Delete this application?');">
                                        <button type="submit" class="btn btn-sm btn-danger">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="app-footer">
        <div class="float-end d-none d-sm-inline">Dacca POS</div>
        <strong>Copyright &copy; 2014-2026&nbsp;<a href="https://adminlte.io" class="text-decoration-none">AdminLTE.io</a>.</strong>
        All rights reserved.
    </footer>
</div>

<div th:replace="fragments/commonscripts :: commonscripts"/>
</body>
</html>
